name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install PyInstaller flask openai pydantic pydantic-settings volcengine

    - name: Copy files
      run: |
        mkdir build_package
        copy 小缘Web工具.spec build_package\
        copy web_tool.py build_package\
        xcopy /E /I /Y src build_package\src

    - name: Build Windows executable
      run: |
        cd build_package
        python -m PyInstaller 小缘Web工具.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 小缘Web工具-Windows
        path: build_package/dist/小缘Web工具.exe
        retention-days: 90
