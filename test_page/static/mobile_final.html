<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>AI红娘小缘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            padding: 8px 15px;
            font-size: 12px;
            text-align: center;
            background: #f0f0f0;
            color: #666;
        }

        .status.online {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.offline {
            background: #ffebee;
            color: #c62828;
        }

        .account-input {
            padding: 15px;
            background: #f8f9fa;
        }

        .account-input input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
        }

        .welcome-card {
            padding: 30px 20px;
            text-align: center;
        }

        .welcome-card .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .welcome-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }

        .welcome-card p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .start-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: none;
        }

        .message {
            margin-bottom: 15px;
            clear: both;
        }

        .message.user {
            text-align: right;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-block;
        }

        .message.ai .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            display: inline-block;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: none;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
        }

        .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 25px;
            background: #f0f0f0;
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }

        .typing-indicator {
            padding: 10px 15px;
            color: #999;
            font-size: 13px;
            display: none;
        }

        .typing-indicator.show {
            display: block;
        }

        .welcome-message {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 75%;
            display: inline-block;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💕 AI红娘小缘</h1>
            <p>同城脱单联盟 · 温暖牵线</p>
        </div>

        <div class="status" id="status">
            <span id="statusText">连接中...</span>
        </div>

        <div class="account-input">
            <input type="text" id="accountId" placeholder="输入你的昵称" value="">
        </div>

        <!-- 欢迎界面 -->
        <div class="welcome-card" id="welcomeCard">
            <div class="avatar">👩‍💼</div>
            <h2>你好呀～我是小缘</h2>
            <p>同城脱单联盟的温柔客服<br>帮你找到心仪的那个TA</p>
            <button class="start-btn" id="startBtn">开始聊天</button>
        </div>

        <!-- 聊天界面 -->
        <div class="chat-box" id="chatBox"></div>
        <div class="typing-indicator" id="typingIndicator">
            小缘正在输入中...
        </div>

        <div class="input-area" id="inputArea">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
            <button class="reset-btn" id="resetBtn">重新开始</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let accountId = '';
        let isProcessing = false;
        let hasStarted = false;

        // 生成随机用户ID
        function generateUserId() {
            return 'user_' + Math.random().toString(36).substr(2, 9);
        }

        // 检查服务状态
        async function checkStatus() {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    status.className = 'status online';
                    statusText.textContent = '● 小缘在线';
                } else {
                    throw new Error('服务不可用');
                }
            } catch (error) {
                status.className = 'status offline';
                statusText.textContent = '● 服务离线';
            }
        }

        // 添加消息
        function addMessage(type, text) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            messageDiv.appendChild(bubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 显示/隐藏加载指示器
        function showTyping() {
            document.getElementById('typingIndicator').classList.add('show');
        }

        function hideTyping() {
            document.getElementById('typingIndicator').classList.remove('show');
        }

        // 开始聊天
        async function startChat() {
            if (hasStarted) return;
            hasStarted = true;
            isProcessing = true;

            const btn = document.getElementById('startBtn');
            btn.textContent = '启动中...';
            btn.disabled = true;

            accountId = document.getElementById('accountId').value || generateUserId();

            // 切换界面
            document.getElementById('welcomeCard').style.display = 'none';
            document.getElementById('chatBox').style.display = 'block';
            document.getElementById('inputArea').style.display = 'block';

            // 清空输入框并确保没有焦点
            const input = document.getElementById('messageInput');
            input.value = '';
            input.blur();

            // 从后端 API 获取欢迎消息（统一管理，只需在 prompts.py 中修改）
            fetch(`${API_BASE}/config/welcome`)
                .then(res => res.json())
                .then(data => {
                    addMessage('ai', data.welcome_message);
                })
                .catch(err => {
                    // 如果 API 调用失败，使用默认消息
                    console.error('获取欢迎消息失败:', err);
                    addMessage('ai', '你好～我是小缘，有什么可以帮你的吗？');
                });

            // 等待一段时间后允许发送
            setTimeout(() => {
                isProcessing = false;
                // 此时可以让用户输入，但不自动聚焦输入框
            }, 1000);
        }

        // 发送消息
        async function sendMessage() {
            if (isProcessing) return;

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            isProcessing = true;
            input.value = '';
            input.blur(); // 发送后移除焦点

            // 添加用户消息
            addMessage('user', message);

            // 发送到服务器
            try {
                showTyping();
                const response = await fetch(`${API_BASE}/api/doubao/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        accountId: accountId,
                        question: message,
                        sex: 'unknown',
                        debug: true  // 永远启用调试模式，显示已收集信息
                    })
                });

                const data = await response.json();
                hideTyping();

                if (data.silent) {
                    // 429配额错误，静默处理，不显示任何消息
                    console.log('服务暂时不可用（配额限制），已静默处理');
                } else if (data.success && data.response) {
                    // 永远显示调试信息
                    let displayText = data.response;
                    if (data.debug_info) {
                        displayText += data.debug_info;
                    }
                    addMessage('ai', displayText);
                } else if (data.error) {
                    addMessage('ai', '抱歉：' + data.error);
                } else {
                    addMessage('ai', '抱歉，处理出错啦，请重试～');
                }
            } catch (error) {
                hideTyping();
                addMessage('ai', '抱歉，网络出错啦，请检查连接后重试～');
            }

            isProcessing = false;
        }

        // 重新开始
        function resetChat() {
            document.getElementById('chatBox').innerHTML = '';
            document.getElementById('welcomeCard').style.display = 'block';
            document.getElementById('chatBox').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('startBtn').textContent = '开始聊天';
            document.getElementById('startBtn').disabled = false;
            hasStarted = false;
            isProcessing = false;
            accountId = generateUserId();
            document.getElementById('accountId').value = accountId;
        }

        // 事件监听
        document.getElementById('startBtn').addEventListener('click', startChat);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('resetBtn').addEventListener('click', resetChat);

        // 回车发送（但需要用户明确在输入框中按回车）
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });

        // 初始化
        accountId = generateUserId();
        document.getElementById('accountId').value = accountId;
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
