gates:
  p0:
    - isolation_pass_rate
    - refusal_respect_rate
  p1:
    - humanlike_pass_rate
    - extraction_pass_rate
    - latency_p95_seconds
    - template_top1_ratio
    - field_stability_score
    - memory_reuse_accuracy
    - baseline_degradation::humanlike_pass_rate
    - baseline_degradation::extraction_pass_rate
    - baseline_degradation::latency_p95
  p2:
    - extraction_exact_match_pass_rate

# 若为 true，则 MQ 未覆盖也视为 P0 失败；本地无服务时建议保持 false
require_mq: false
