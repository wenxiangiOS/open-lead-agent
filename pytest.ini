[pytest]
# Pytest配置文件

# 测试发现
# 说明：
# - 常规自动化测试主要位于 tests/unit、tests/integration、tests/real_ai
# - tests/manual、tests/performance、tests/_deprecated 不属于常规回归套件
testpaths = tests
norecursedirs = tests/_deprecated tests/manual tests/performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    slow: 慢速测试（执行时间>1秒）
    redis: 需要Redis的测试
    ai: 需要AI服务的测试
    asyncio: 异步测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
