template:
  id: matchmaking
  name: 婚恋线索助手
  description: 用于收集婚恋匹配资料和联系方式。

agent:
  name: 小缘
  language: zh-CN
  tone: 温暖、自然、有分寸，不给用户压力。
  welcome_message: "你好呀，我是小缘。你是认真想找对象，还是想先了解一下服务？"

conversation:
  # 单轮回复里最多主动追问几个字段。建议保持 1，避免一次问太多让用户有压力。
  max_questions_per_turn: 1
  # 用户先问问题时，是否先回答用户问题，再继续收集字段。
  answer_question_before_collection: true
  # AI 回复的最大字数。设置短一点可以让客服回复更像聊天，而不是长篇说明。
  response_max_chars: 220
  # 是否允许在对话中提示转人工、预约顾问或后续人工跟进。
  allow_handoff: true

field_groups:
  core:
    - key: sex
      label: 性别
      type: enum
      options: ["男", "女", "其他", "暂不透露"]
      ask: "方便问一下你的性别吗？"

    - key: age
      label: 年龄
      type: number
      ask: "你今年多大了？"

    - key: education
      label: 学历
      type: enum
      options: ["高中及以下", "大专", "本科", "硕士", "博士", "其他"]
      ask: "你的最高学历是？"

    - key: occupation
      label: 职业
      type: text
      ask: "你现在主要做什么工作？"

    - key: location
      label: 所在城市
      type: text
      ask: "你目前在哪个城市？"

  medium:
    - key: marital_status
      label: 婚姻状态
      type: enum
      options: ["未婚", "离异", "丧偶", "其他"]
      ask: "方便了解一下你的婚姻状态吗？"

    - key: partner_requirement
      label: 择偶要求
      type: text
      ask: "你对另一半有什么比较看重的要求？"

    - key: monthly_income
      label: 月收入
      type: enum
      options: ["5千以下", "5千-1万", "1万-2万", "2万-5万", "5万以上", "暂不透露"]
      ask: "如果方便的话，也可以了解一下你的月收入区间。"

  low:
    - key: last_name
      label: 姓氏
      type: text

    - key: height
      label: 身高
      type: number

    - key: weight
      label: 体重
      type: number

contact:
  enabled: true
  ask_after_required_fields: true
  privacy_message: "联系方式只会用于后续沟通，不会公开展示。"
  methods:
    - key: phone
      label: Phone
      type: phone
      required: false
      ask_limit: 2
      ask: "方便留个手机号，后续顾问好跟你沟通吗？"
    - key: wechat
      label: WeChat
      type: wechat
      required: false
      ask_limit: 2
      ask: "如果你更方便微信，也可以留一下微信号。"

faq:
  - intent: pricing
    keywords: ["price", "cost", "fee", "pricing"]
    answer: "基础咨询通常可以免费，定制服务是否收费取决于具体业务设置。"
    continue_collection: true

rag:
  enabled: false
  knowledge_base_path: ./knowledge/matchmaking
  top_k: 5
  score_threshold: 0.65
  require_citation: true
