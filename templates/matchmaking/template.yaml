template:
  id: matchmaking
  name: 婚恋线索助手
  description: 用于收集婚恋匹配资料和联系方式。

agent:
  # AI 客服名称，会出现在 system prompt 里。
  # Agent name used in prompts and CLI display.
  name: 小缘
  # 回复语言。中文客服建议使用 zh-CN。
  # Reply language. Use zh-CN for Chinese agents.
  language: zh-CN
  # 核心身份。用于告诉模型“你是谁”。
  # Agent role. Tells the model who it is.
  role: 婚恋咨询顾问
  # 说话风格。越具体，模型越稳定。
  # Tone guidance. More specific is usually more stable.
  tone: 温暖、自然、有分寸，不给用户压力。
  # 对话类提示词放到 prompts/dialogue/ 下，避免 template.yaml 过长。
  # Dialogue prompts live under prompts/dialogue/ to keep this YAML readable.
  persona_file: prompts/dialogue/persona.md
  goals_file: prompts/dialogue/goals.yaml
  behavior_rules_file: prompts/dialogue/behavior_rules.yaml
  boundaries_file: prompts/dialogue/boundaries.yaml
  welcome_message: "你好呀，我是小缘。你是认真想找对象，还是想先了解一下服务？"

# ==================== Opening / 开场白 ====================
opening:
  enabled: true
  # 系统自动开场白，通常由 CLI/前端在用户首次进入时展示。
  # Auto welcome message, usually shown by CLI/frontend before the first user turn.
  message: "你好呀，我是小缘。你是认真想找对象，还是想先了解一下服务？"
  # 用户看完开场白后只回“你好”时的低压承接；不会立刻进入字段采集。
  # Low-pressure reply when the user only says hello after the opening; avoids instant field collection.
  greeting_response: "你好呀，你也可以先简单介绍下自己，我先了解下你的情况。"
  # 快捷回复建议。Quick reply suggestions for UI/CLI display.
  quick_replies:
    - 怎么了解合适的人？
    - 想找适合自己的男生/女生？

# ==================== Conversation / 对话基础配置 ====================
conversation:
  # 单轮回复里最多主动追问几个字段。建议保持 1，避免一次问太多让用户有压力。
  # Max active profile questions per turn. Keep 1 to avoid form-like pressure.
  max_questions_per_turn: 1
  # 用户先问问题时，是否先回答用户问题，再继续收集字段。
  # Answer user questions before returning to collection.
  answer_question_before_collection: true
  # AI 回复的最大字数。设置短一点可以让客服回复更像聊天，而不是长篇说明。
  # Max reply length. Shorter replies feel more conversational.
  response_max_chars: 220
  # 是否允许在对话中提示转人工、预约顾问或后续人工跟进。
  # Whether handoff/follow-up wording is allowed.
  allow_handoff: true

dialogue_policy:
  # 主对话策略放到 prompts/dialogue/ 下。
  # Main dialogue policy lives under prompts/dialogue/.
  file: prompts/dialogue/dialogue_policy.yaml

extraction:
  # 信息提取提示词放到 prompts/extraction/ 下。
  # 用户配置哪些字段，系统就只提取哪些字段；这里写婚恋行业的消歧规则。
  # Extraction prompt lives under prompts/extraction/.
  # Only configured fields are extracted; this file adds matchmaking-specific disambiguation rules.
  enabled: true
  prompt_file: prompts/extraction/rules.md

field_routing:
  # auto 表示用户只配置字段，系统自动按上下文选择更自然的下一问。
  # 例如用户刚说“我在深圳”，系统会优先顺着问工作，而不是机械按字段顺序追问。
  # auto lets users configure fields only; the engine picks a natural next question by context.
  # Example: after "I am in Shenzhen", it can ask occupation instead of following a rigid order.
  mode: auto
  prefer_contextual_followup: true

# ==================== Profile Fields / 资料字段 ====================
field_groups:
  # core 是主线核心字段，会优先主动询问；默认 ask_limit=2。
  # core fields are actively collected first; default ask_limit=2.
  core:
    - key: sex
      label: 性别
      type: enum
      options: ["男", "女", "其他", "暂不透露"]
      # ask 是兜底问法，不是固定话术。
      # Fallback ask text, not a fixed script.
      # Used when LLM is unavailable, response repair is needed,
      # or an FAQ answer needs to append the next field question.
      ask: "我先了解下，你这边是男生还是女生呀？"

    - key: age
      label: 年龄
      type: number
      risk: high
      min_confidence: 0.8
      # 高风险字段低置信度时会进入 pending 确认，不直接覆盖资料。
      # High-risk fields with low confidence go to pending confirmation instead of direct write.
      ask: "你今年多大了？"

    - key: education
      label: 学历
      type: enum
      options: ["高中及以下", "大专", "本科", "硕士", "博士", "其他"]
      ask: "你的最高学历是？"

    - key: occupation
      label: 职业
      type: text
      ask: "你现在主要做什么工作？"

    - key: location
      label: 所在城市
      type: text
      ask: "你目前在哪个城市？"

  # medium 是中等字段，可在语义相近时顺带问；默认 ask_limit=1。
  # medium fields may be asked as related side targets; default ask_limit=1.
  medium:
    - key: marital_status
      label: 婚姻状态
      type: enum
      options: ["单身", "未婚", "离异", "丧偶", "其他"]
      ask: "方便了解一下你的婚姻状态吗？"

    - key: partner_requirement
      label: 择偶要求
      type: text
      ask: "你对另一半有什么比较看重的要求？"

    - key: monthly_income
      label: 月收入
      type: enum
      risk: high
      min_confidence: 0.8
      options: ["5千以下", "5千-1万", "1万-2万", "2万-5万", "5万以上", "暂不透露"]
      ask: "如果方便的话，也可以了解一下你的月收入区间。"

  # low 是低优字段，默认不主动问，只在用户主动说出时被动提取。
  # low fields are passive by default; they are extracted only when users mention them.
  low:
    - key: last_name
      label: 姓氏
      type: text

    - key: height
      label: 身高
      type: number
      # 身高是低优被动字段，保留用户原始口径，如 168+、178cm。
      # Passive display field: preserve user wording such as 168+ or 178cm.
      validation: preserve_raw

    - key: weight
      label: 体重
      type: number
      # 体重是低优被动字段，保留用户原始口径，如 50kg。
      # Passive display field: preserve user wording such as 50kg.
      validation: preserve_raw

# ==================== Contact / 联系方式 ====================
contact:
  enabled: true
  ask_after_required_fields: true
  # trigger 控制什么时候可以进入联系方式收集。
  # trigger controls when contact collection is allowed.
  trigger:
    mode: coverage_gate
    # required_fields 是进入联系方式前重点覆盖的核心资料。
    # required_fields are core profile fields to cover before asking contact methods.
    required_fields:
      - sex
      - age
      - education
      - occupation
      - location
    # optional_fields 是中等字段；设置 require_all_optional_covered=true 后，
    # 这些字段需要“已收集 / 已有效询问到上限 / 用户明确跳过”才会进入联系方式。
    # optional_fields are medium-priority fields. With require_all_optional_covered=true,
    # they must be covered before contact collection starts.
    optional_fields:
      - marital_status
      - partner_requirement
      - monthly_income
    # 至少实际收集到几个 required_fields 后，才允许问联系方式。
    # 0 表示不按“实际收集数量”卡住，而是按 covered 状态判断。
    # Minimum actually collected required fields before contact collection is allowed.
    # 0 means rely on covered state instead of collected count.
    min_required_collected: 0
    # true 表示未收集到的核心字段，问满 ask_limit 后也算 covered。
    # true means uncollected core fields count as covered once their ask_limit is exhausted.
    require_all_core_covered: true
    # true 表示中等字段也要 covered 后，才进入联系方式。
    # true means medium fields must also be covered before asking contact methods.
    require_all_optional_covered: true
  privacy_message: "联系方式只会用于后续沟通，不会公开展示。"
  # methods 可配置电话、微信、邮箱、QQ、WhatsApp、Telegram 等。
  # methods can be phone, WeChat, email, QQ, WhatsApp, Telegram, etc.
  methods:
    - key: phone
      label: Phone
      type: phone
      validation: phone
      required: false
      ask_limit: 2
      # 联系方式 ask 也是兜底问法；正常有 LLM 时会作为目标参考。
      # Contact ask is also fallback text; with LLM it is used as target guidance.
      ask: "方便留个手机号，后续顾问好跟你沟通吗？"
    - key: wechat
      label: WeChat
      type: wechat
      validation: wechat
      required: false
      ask_limit: 2
      ask: "如果你更方便微信，也可以留一下微信号。"

# ==================== FAQ / 常见问题 ====================
faq:
  - intent: pricing
    # keywords 命中后会优先答疑，再按 continue_collection 决定是否回主线。
    # If keywords match, answer FAQ first; continue_collection decides whether to return to collection.
    keywords: ["price", "cost", "fee", "pricing", "收费", "多少钱", "价格"]
    answer: "基础咨询通常可以免费，定制服务是否收费取决于具体业务设置。"
    continue_collection: true

# ==================== Compliance / 合规边界 ====================
compliance:
  enabled: true
  rules:
    - id: underage
      description: 未成年人不继续收集婚恋资料
      semantic_signals:
        - underage
      # 语义信号低于该置信度时不会触发合规结束。
      # Semantic signals below this confidence do not trigger compliance ending.
      semantic_min_confidence: 0.75
      when:
        field: age
        operator: lt
        value: 18
      action: end
      message: "这个我得先说明一下，我们这边只面向成年人提供服务。等你成年后再了解会更合适。"
    - id: pending_divorce
      description: 分居或离婚手续未办妥时礼貌结束
      semantic_signals:
        - pending_divorce
        - separated_not_finalized
      semantic_min_confidence: 0.75
      when:
        field: marital_status
        operator: in
        in: ["分居中", "手续办理中"]
      action: end
      message: "这种情况建议等手续都处理清楚后再了解，会更稳妥一点。"

# ==================== Closing / 收尾 ====================
closing:
  enabled: true
  # 收尾不是无限聊天；联系方式完成、联系方式覆盖或无下一步时自然结束。
  # Closing prevents endless chat after contact is collected/covered or no next action exists.
  trigger:
    after_contact_collected: true
    after_contact_covered: true
    when_no_next_action: true
  message: "好的，我这边先帮你记下了。后续如果有合适进展，会再跟你沟通。"

# ==================== Humanization / 拟人化 ====================
humanization:
  enabled: true
  # 避免连续重复同一种开头，让回复更像真人接话。
  # Avoid repeating the same opening phrase across turns.
  avoid_repeated_openings: true
  max_active_questions_per_turn: 1
  prefer_contextual_followup: true
  avoid_script_like_questions: true
  recent_phrase_window: 5

# ==================== RAG / 知识库 ====================
rag:
  enabled: false
  # RAG 适合放较长、稳定的业务文档；短答案优先放 FAQ。
  # Use RAG for longer stable documents; use FAQ for short stable answers.
  knowledge_base_path: ./knowledge/matchmaking
  top_k: 5
  score_threshold: 0.65
  require_citation: true
