template:
  id: matchmaking
  name: 婚恋线索助手
  description: 用于收集婚恋匹配资料和联系方式。

agent:
  name: 小缘
  language: zh-CN
  tone: 温暖、自然、有分寸，不给用户压力。
  welcome_message: "你好呀，我是小缘。你是认真想找对象，还是想先了解一下服务？"

conversation:
  max_questions_per_turn: 1
  answer_question_before_collection: true
  response_max_chars: 220
  allow_handoff: true

fields:
  - key: sex
    label: Gender
    type: enum
    options: ["male", "female", "other", "unknown"]
    required: true
    priority: 10
    ask_limit: 2
    ask: "方便问一下你的性别吗？"

  - key: age
    label: Age
    type: number
    required: true
    priority: 20
    ask_limit: 2
    ask: "你今年多大了？"

  - key: location
    label: City
    type: text
    required: true
    priority: 30
    ask_limit: 2
    ask: "你目前在哪个城市？"

  - key: occupation
    label: Occupation
    type: text
    required: false
    priority: 40
    ask_limit: 1
    ask: "你现在主要做什么工作？"

contact:
  enabled: true
  ask_after_required_fields: true
  privacy_message: "联系方式只会用于后续沟通，不会公开展示。"
  methods:
    - key: phone
      label: Phone
      type: phone
      required: false
      ask_limit: 2
      ask: "方便留个手机号，后续顾问好跟你沟通吗？"
    - key: wechat
      label: WeChat
      type: wechat
      required: false
      ask_limit: 2
      ask: "如果你更方便微信，也可以留一下微信号。"

faq:
  - intent: pricing
    keywords: ["price", "cost", "fee", "pricing"]
    answer: "基础咨询通常可以免费，定制服务是否收费取决于具体业务设置。"
    continue_collection: true

rag:
  enabled: false
  knowledge_base_path: ./knowledge/matchmaking
  top_k: 5
  score_threshold: 0.65
  require_citation: true
