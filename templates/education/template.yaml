template:
  id: education
  name: 教培课程顾问
  description: 用于回答课程问题并收集试听课线索。

agent:
  name: 课程顾问
  language: zh-CN
  tone: 友好、专业、简洁，不强行推销。
  welcome_message: "你好，想了解哪个年级或科目的课程？"

conversation:
  # 单轮回复里最多主动追问几个字段。建议保持 1，避免一次问太多让用户有压力。
  max_questions_per_turn: 1
  # 用户先问问题时，是否先回答用户问题，再继续收集字段。
  answer_question_before_collection: true
  # AI 回复的最大字数。设置短一点可以让客服回复更像聊天，而不是长篇说明。
  response_max_chars: 220
  # 是否允许在对话中提示转人工、预约顾问或后续人工跟进。
  allow_handoff: true

fields:
  - key: student_grade
    label: Student Grade
    type: text
    required: true
    priority: 10
    ask_limit: 2
    ask: "学生现在读几年级？"

  - key: subject
    label: Subject
    type: text
    required: true
    priority: 20
    ask_limit: 2
    ask: "主要想了解哪个科目？"

  - key: learning_problem
    label: Learning Problem
    type: text
    required: false
    priority: 30
    ask_limit: 1
    ask: "目前最想解决的学习问题是什么？"

contact:
  enabled: true
  ask_after_required_fields: true
  privacy_message: "联系方式只会用于后续课程咨询。"
  methods:
    - key: phone
      label: Phone
      type: phone
      required: true
      ask_limit: 2
      ask: "方便留个手机号，课程顾问后续给你更具体的建议吗？"

faq:
  - intent: pricing
    keywords: ["price", "cost", "fee", "tuition"]
    answer: "课程价格会根据年级、科目和班型不同而变化。我可以先了解你的需求，再帮你安排更准确的咨询。"
    continue_collection: true

rag:
  enabled: false
  knowledge_base_path: ./knowledge/education
  top_k: 5
  score_threshold: 0.65
  require_citation: true
