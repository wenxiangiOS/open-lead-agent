services:
  open-lead-agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    working_dir: /app
    volumes:
      - ../..:/app
    ports:
      - "8000:8000"
    # Load local environment variables from project root `.env`.
    # 从项目根目录的 `.env` 读取本地环境变量。
    #
    # Tip: copy `.env.example` to `.env` first, then fill in your LLM settings.
    # 提示：先复制 `.env.example` 为 `.env`，再填写大模型配置。
    env_file:
      - ../../.env
